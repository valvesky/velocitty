<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title description" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="title">Velocitty 1.3.1: fewer instructions for progress redraws</title>
<desc id="description">User-mode instructions normalized to the 1.3 baseline. Lower is better. Progress redraws use about 65 percent fewer instructions.</desc>
<rect width="1800" height="1120" fill="#fcfcfb"/>
<text x="80" y="100" font-size="54" font-weight="500" fill="#0b0b0b">Less work for progress redraws</text>
<text x="80" y="151" font-size="28" fill="#52514e">User-mode instructions · 1.3 baseline = 100% · lower is better</text>
<rect x="80" y="190" width="28" height="23" rx="3" fill="#c3c2b7"/>
<text x="122" y="210" font-size="24" fill="#52514e">1.3 before</text>
<rect x="370" y="190" width="28" height="23" rx="3" fill="#15836b"/>
<text x="412" y="210" font-size="24" fill="#52514e">1.3.1 progress proof</text>
<text x="1720" y="259" text-anchor="end" font-size="23" fill="#52514e">Change</text>
<line x1="570.0" y1="275" x2="570.0" y2="940" stroke="#e1e0d9"/>
<text x="570.0" y="259" text-anchor="middle" font-size="21" fill="#52514e">0%</text>
