<text x="1177.5" y="259" text-anchor="middle" font-size="21" fill="#52514e">75%</text>
<line x1="1380.0" y1="275" x2="1380.0" y2="940" stroke="#e1e0d9"/>
<text x="1380.0" y="259" text-anchor="middle" font-size="21" fill="#52514e">100%</text>
<text x="80" y="315" font-size="29" font-weight="600" fill="#0b0b0b">Progress redraws</text>
<text x="80" y="346" font-size="22" fill="#52514e">106-byte updates</text>
<text x="80" y="380" font-size="23" fill="#52514e">137.91M → 48.48M</text>
